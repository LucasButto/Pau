<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Metadatos de cada página. Los textos (título, descripción, redes) se editan en src/content/site.ts:
      vite-plugins/seo.ts completa los {{...}} con los de la página que corresponde a cada ruta y con la
      URL pública del sitio (ver .env.example).
    -->
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="{{PAGE_URL}}" />

    <!-- Redes sociales: WhatsApp, Facebook, LinkedIn, X -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PAU Rosario" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="{{PAGE_URL}}" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{SITE_URL}}/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Programa de Agricultura Urbana de Rosario. PLANTATE. No seas nabo." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SITE_URL}}/og-image.png" />
    <meta name="twitter:image:alt" content="Programa de Agricultura Urbana de Rosario. PLANTATE. No seas nabo." />

    <!-- Identidad: navegador, pantalla de inicio del celular, instalación -->
    <meta name="theme-color" content="#6A7332" />
    <meta name="application-name" content="PAU Rosario" />
    <meta name="apple-mobile-web-app-title" content="PAU Rosario" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Imagen principal de la página (LCP): la precarga la agrega vite-plugins/seo.ts acá. -->
    <!-- pau:preload -->

    <!-- Conexiones y tipografía de respaldo (Outfit) mientras no estén los archivos de Pacaembu -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..800&display=swap" />

    <!-- Datos estructurados (schema.org) -->
    <script type="application/ld+json">{{JSON_LD}}</script>
  </head>
  <body>
    <noscript>
      <h1>{{NOSCRIPT_TITLE}}</h1>
      <p>{{DESCRIPTION}}</p>
      <p>Para ver el sitio completo (mapa, buscador y novedades), activá JavaScript en tu navegador.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
